<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>TaskFlow</h1>
            <p>Organize your tasks efficiently</p>
        </header>

        <section class="stats">
            <div class="stat-card">
                <h3>Total</h3>
                <p id="totalTasks">0</p>
            </div>
            <div class="stat-card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>
            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>
        </section>

        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Search tasks...">
        </section>

        <section class="filters">
            <button class="filter-btn" data-filter="all">All</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
        </section>

        <main>
            <section class="task-form">
                <h2>Add New Tasks</h2>
                <form id="taskForm">
                    <input type="text" id="taskTitle" placeholder="Task Title" maxlength="45" required>
                    <textarea id="taskDescription" placeholder="Task Description" maxlength="200" required></textarea>
                    <button type="submit">Add Task</button>
                    <div class="form-group">
                        <label for="taskPriority">
                            Priority
                        </label>
                        <select id="taskPriority">
                            <option value="high">
                                High
                            </option>
                            <option value="medium">
                                Medium
                            </option>
                            <option value="low">
                                Low
                            </option>
                        </select>
                    </div>
                </form>
            </section>
            <section class="task-list">
                <h2>Tasks</h2>
                <div id="tasksContainer">
                </div>
            </section>     
        </main> 
    </div>
    <script src="script.js"></script>
</body>
</html>
