<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>TaskFlow</h1>
            <p>Organize your tasks efficiently</p>
        </header>
        <main>
            <section class="task-form">
                <h2>Add New Tasks</h2>
                <form id="taskForm">
                    <input type="text" id="taskTitle" placeholder="Task Title" maxlength="45" required>
                    <textarea id="taskDescription" placeholder="Task Description" maxlength="200" required></textarea>
                    <button type="submit">Add Task</button>
                </form>
            </section>
            <section class="task-list">
                <h2>Tasks</h2>
                <div id="tasksContainer"></div>
            </section>     
        </main> 
    </div>
    <script src="script.js"></script>
</body>
</html>
